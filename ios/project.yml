name: Bottomless
options:
  bundleIdPrefix: com.shaunakkapur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Bottomless.xcconfig
  Release: Config/Bottomless.xcconfig
packages:
  BottomlessCore:
    path: Packages/BottomlessCore
targets:
  Bottomless:
    type: application
    platform: iOS
    sources:
      - path: Bottomless
    dependencies:
      - package: BottomlessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOTTOMLESS_BUNDLE_ID)
        PRODUCT_NAME: Bottomless
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BOTTOMLESS_TEAM_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bottomless/Info.plist
        ENABLE_PREVIEWS: YES
  BottomlessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BottomlessUITests
    dependencies:
      - target: Bottomless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOTTOMLESS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BOTTOMLESS_TEAM_ID)
        TEST_TARGET_NAME: Bottomless
schemes:
  Bottomless:
    build:
      targets:
        Bottomless: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BottomlessUITests
